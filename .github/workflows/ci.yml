name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      # Prisma 7 requires this even for generate (postinstall / explicit generate)
      DATABASE_URL: postgresql://channelmaker:channelmaker@localhost:5432/channelmaker?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Designer tests
        run: pnpm test:web

      - name: E2E tests
        run: pnpm test:e2e
        env:
          # Ryuk is pulled from Docker Hub. Skip it on shared runners.
          # Local Fedora still sets this in test:e2e:local.
          TESTCONTAINERS_RYUK_DISABLED: 'true'
