services:
  postgres:
    image: postgres:16-alpine
    container_name: channel-maker-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: channelmaker
      POSTGRES_PASSWORD: channelmaker
      POSTGRES_DB: channelmaker
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U channelmaker -d channelmaker']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: channel-maker-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  lgtm:
    image: grafana/otel-lgtm:latest
    container_name: channel-maker-lgtm
    restart: unless-stopped
    ports:
      - '3001:3000' # Grafana UI (not 3000)
      - '4317:4317' # OTLP gRPC
      - '4318:4318' # OTLP HTTP  ← what instrumentation.ts uses
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - lgtm_data:/data

  # Designer only. `docker compose up -d` still starts db, redis, and lgtm.
  # `docker compose --profile ui up web` installs and runs Next on 3002.
  web:
    image: node:24-alpine
    container_name: channel-maker-web
    working_dir: /app
    profiles: ['ui']
    command: >
      sh -c "corepack enable && corepack prepare pnpm@11 --activate
      && pnpm install
      && pnpm --filter @channel-maker/web dev"
    ports:
      - '3002:3002'
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
      - web_app_node_modules:/app/apps/web/node_modules
    environment:
      NEXT_TELEMETRY_DISABLED: '1'
      API_BASE_URL: http://host.docker.internal:3000
    extra_hosts:
      - 'host.docker.internal:host-gateway'

volumes:
  postgres_data:
  redis_data:
  lgtm_data:
  web_node_modules:
  web_app_node_modules:
