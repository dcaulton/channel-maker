services:
  postgres:
    image: postgres:16-alpine
    container_name: channel-maker-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: channelmaker
      POSTGRES_PASSWORD: channelmaker
      POSTGRES_DB: channelmaker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U channelmaker -d channelmaker"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
